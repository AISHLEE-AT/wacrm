name: FAGO Super App CI/CD Pipeline

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  # -----------------------------------------------------------------
  # Job 1: Next.js Web App CI (Typecheck & Build)
  # -----------------------------------------------------------------
  web-ci:
    name: 🌐 Web App (Next.js) CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'apps/web/package-lock.json'

      - name: Install Web Dependencies
        working-directory: apps/web
        run: npm ci || npm install

      - name: TypeScript Type Check
        working-directory: apps/web
        run: npx tsc --noEmit

      - name: Build Production Next.js Bundle
        working-directory: apps/web
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

  # -----------------------------------------------------------------
  # Job 2: Flutter App CI (Analyze & Build Release APK)
  # -----------------------------------------------------------------
  flutter-ci:
    name: 📱 Flutter Mobile App CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Install Flutter Dependencies
        working-directory: apps/fago_app
        run: flutter pub get

      - name: Static Analysis
        working-directory: apps/fago_app
        run: flutter analyze

      - name: Build Release Android APK
        working-directory: apps/fago_app
        run: flutter build apk --release

      - name: Upload Flutter Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fago-flutter-release-apk
          path: apps/fago_app/build/app/outputs/flutter-apk/app-release.apk

  # -----------------------------------------------------------------
  # Job 3: Native Android App CI (Gradle Build)
  # -----------------------------------------------------------------
  android-native-ci:
    name: 🤖 Native Android App CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Gradle Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant Execute Permission for Gradle Wrapper
        working-directory: apps/fago_native
        run: chmod +x gradlew

      - name: Build Native Android APK
        working-directory: apps/fago_native
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload Native Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fago-native-release-apk
          path: apps/fago_native/app/build/outputs/apk/release/*.apk
