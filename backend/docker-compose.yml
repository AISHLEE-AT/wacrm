version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: supro_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: supro_secret
      POSTGRES_DB: supro
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  backend:
    build: .
    container_name: supro_backend
    restart: always
    ports:
      - "127.0.0.1:8080:8080"
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    environment:
      - DB_HOST=db
      - DB_USER=postgres
      - DB_PASSWORD=supro_secret
      - DB_NAME=supro
      - PORT=8080
      - META_ACCESS_TOKEN=${META_ACCESS_TOKEN}
      - META_PHONE_NUMBER_ID=${META_PHONE_NUMBER_ID}
      - META_WABA_ID=${META_WABA_ID}
      - META_VERIFY_TOKEN=${META_VERIFY_TOKEN}
    volumes:
      - /var/www/cdn:/var/www/cdn
    depends_on:
      - db

  rest:
    image: postgrest/postgrest:latest
    container_name: supro_rest
    restart: always
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      PGRST_DB_URI: "postgres://postgres:supro_secret@db:5432/supro"
      PGRST_DB_SCHEMAS: "public"
      PGRST_DB_ANON_ROLE: "postgres"
      PGRST_JWT_SECRET: "O10rRIsebW9sc/WYhB7eJFm5RFfcAgIO/fdBc9QiGtplSrdNh0wdxgXx3NZsdxltbr5zqLdK1QgQNB94P8GDGw=="
    depends_on:
      - db

volumes:
  pgdata:
